name: Nifty 50 Scanner

on:
  schedule:
    # Runs every 15 minutes, Mon-Fri, 9:00-15:45 IST = 3:30-10:15 UTC
    # (GitHub cron times are UTC; IST is UTC+5:30)
    - cron: "30,45 3 * * 1-5"
    - cron: "0,15,30,45 4-9 * * 1-5"
    - cron: "0,15 10 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install nsepython

      - name: Run scanner
        run: python scanner.py

      - name: Commit and push updated page
        run: |
          git config user.name "nifty-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/latest.json
          git diff --quiet --cached || git commit -m "Update scan $(date -u)"
          git push
